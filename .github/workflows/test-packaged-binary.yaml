          PIXI_ENV=$(pixi info --json | python3 -c "import json, sys; data = json.load(sys.stdin); env = [e for e in data['environments_info'] if e['name'] == 'default'][0]; print(env['prefix'])")
          # Copy the entire environment to the bundle
          cp -r "$PIXI_ENV" smoke/geodepot/env
          # Clean up activation scripts that may contain build-path references
          rm -rf smoke/geodepot/env/etc/conda/activate.d
          rm -rf smoke/geodepot/env/etc/conda/deactivate.d
          # Remove path-leaking bin wrappers
          python packaging/ci/remove_path_leaking_bin_wrappers.py smoke/geodepot/env "$GITHUB_WORKSPACE"
          # Add wrapper script
          cp packaging/pixi/geodepot.sh smoke/geodepot/geodepot
          chmod +x smoke/geodepot/geodepot

      - name: Test binary --help
        run: ./smoke/geodepot/geodepot --help

      - name: Test binary init
        run: "mkdir -p smoke/test_repo && cd smoke/test_repo && ../geodepot/geodepot init"

      - name: Test binary add geopackage
        run: "cd smoke/test_repo && ../geodepot/geodepot add test_case ../../tests/data/sources/wippolder/wippolder.gpkg"

      - name: Test binary add cityjson
        run: "cd smoke/test_repo && ../geodepot/geodepot add cityjson_case ../../tests/data/sources/wippolder/3dbag-10-286-560.city.json"

      - name: Test binary list
        run: "cd smoke/test_repo && ../geodepot/geodepot list"

      - name: Test binary show
        run: "cd smoke/test_repo && ../geodepot/geodepot show test_case"

      - name: Test binary remote add
        run: "cd smoke/test_repo && ../geodepot/geodepot remote add test_remote http://example.com/test"

      - name: Test binary fetch (should fail gracefully with non-existent remote)
        run: "cd smoke/test_repo && ../geodepot/geodepot fetch test_remote 2>&1 || true"

      - name: Test binary push (should fail gracefully with non-existent remote)
        run: "cd smoke/test_repo && ../geodepot/geodepot push test_remote 2>&1 || true"

      - name: Test binary pull (should fail gracefully with non-existent remote)
        run: "cd smoke/test_repo && ../geodepot/geodepot pull test_remote 2>&1 || true"

      - name: Cleanup smoke directory
